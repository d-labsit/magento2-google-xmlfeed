name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpcs:
    name: Coding standard (Magento2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Install magento-coding-standard
        run: composer global require --no-interaction --no-progress magento/magento-coding-standard:^40
      - name: Run phpcs
        run: |
          HOME_DIR=$(composer global config home)
          PHPCS="$HOME_DIR/vendor/bin/phpcs"
          "$PHPCS" --config-set installed_paths "$HOME_DIR/vendor/magento/magento-coding-standard"
          "$PHPCS" --standard=Magento2 --severity=8 --extensions=php,phtml \
            --ignore='*/Test/*' \
            Block Console Controller Cron Helper Logger Model Setup registration.php

  phpunit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Install phpunit
        run: composer global require --no-interaction --no-progress phpunit/phpunit:^12.5
      - name: Run phpunit
        run: $(composer global config home)/vendor/bin/phpunit
